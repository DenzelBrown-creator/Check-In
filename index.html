<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Daily Check-In</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f7f8f6, #eef1ee);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.04);
      margin: auto;
    }
    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #2f3a34;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }
    .password-screen input {
      padding: 14px 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      width: 100%;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    .password-screen button {
      background: #2f8f6b;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      width: 100%;
    }
    .error {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
    .user-select { 
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .user-select button {
      padding: 14px 20px;
      background: #e6ebe8;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 16px;
    }
    .user-select button:hover { background: #d0d8d2; }
    .user-select button.selected { background: #2f8f6b; color: white; }
    p {
      font-size: 15px;
      color: #6b756f;
      line-height: 1.5;
      margin-bottom: 30px;
    }
    .status-container {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }
    .user-status { 
      text-align: center;
      flex: 1;
      min-width: 140px;
    }
    .user-status h3 {
      font-size: 16px;
      font-weight: 500;
      color: #555;
      margin-bottom: 12px;
    }
    .status-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 0 auto 15px;
      background: #e6ebe8;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .status-circle.checked-in {
      background: #7ec9a2;
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(126, 201, 162, 0.3);
    }
    .status-circle.expiring-soon {
      background: #ffb347;
      animation: gentle-pulse 2s infinite;
    }
    .status-circle.checked-in::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 34px;
      color: white;
      font-weight: 500;
    }
    @keyframes gentle-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    .pulse-animation { animation: pulse 0.6s ease; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1.05); } }
    button#checkInBtn {
      background: #2f8f6b;
      border: none;
      border-radius: 14px;
      padding: 16px 32px;
      font-size: 17px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 18px rgba(47,143,107,0.25);
      margin-top: 20px;
      width: 100%;
      max-width: 280px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    button#checkInBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(47,143,107,0.3);
    }
    button#checkInBtn:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(47,143,107,0.25);
    }
    button#checkInBtn.clicked { animation: buttonClick 0.4s ease; }
    @keyframes buttonClick { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
    #lastUpdate {
      font-size: 13px;
      color: #888;
      margin-top: 25px;
      font-style: italic;
      text-align: center;
    }
    .time-text { 
      font-size: 14px; 
      color: #666; 
      min-height: 20px;
      word-break: break-word;
    }
    .expiry-info { 
      font-size: 12px; 
      color: #888; 
      margin-top: 5px; 
      min-height: 16px;
    }
    .timezone-info { 
      font-size: 11px; 
      color: #aaa; 
      margin-top: 2px; 
      font-style: italic;
      word-break: break-word;
    }
    
    @media (max-width: 480px) {
      body {
        padding: 15px;
        justify-content: flex-start;
        min-height: 100vh;
      }
      .card {
        padding: 30px 24px;
        width: 100%;
        max-width: 100%;
        border-radius: 18px;
        margin: 0;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        margin-bottom: 25px;
      }
      .status-circle {
        width: 80px;
        height: 80px;
      }
      .status-circle.checked-in::after {
        font-size: 30px;
      }
      .user-status {
        min-width: 120px;
      }
      .user-status h3 {
        font-size: 15px;
      }
      .status-container {
        gap: 15px;
      }
      button#checkInBtn {
        padding: 15px 28px;
        font-size: 16px;
        max-width: 100%;
      }
      .password-screen input {
        padding: 16px 20px;
        font-size: 17px;
      }
      .password-screen button {
        padding: 16px 20px;
        font-size: 17px;
      }
      .user-select button {
        padding: 16px 20px;
        font-size: 17px;
      }
    }
    
    @media (max-width: 360px) {
      .status-container {
        flex-direction: column;
        align-items: center;
      }
      .user-status {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Daily Check-In</h1>
    
    <div id="passwordScreen" class="password-screen">
      <p>Enter access code:</p>
      <input type="password" id="passwordInput" placeholder="Enter code" />
      <button onclick="checkPassword()">Access</button>
      <div id="passwordError" class="error">Incorrect code</div>
    </div>
    
    <div id="loginScreen" style="display: none;">
      <p>Who are you?</p>
      <div class="user-select">
        <button onclick="setUser('you')">Denzel/Him</button>
        <button onclick="setUser('her')">You/Her</button>
      </div>
    </div>
    
    <div id="appScreen" style="display: none;">
      <p>A quiet signal to let the other person know you're okay today.</p>
      <div class="status-container">
        <div class="user-status">
          <h3 id="myLabel">You</h3>
          <div id="myStatus" class="status-circle"></div>
          <div id="myTime" class="time-text">-</div>
          <div id="myTimezone" class="timezone-info"></div>
          <div id="myExpiry" class="expiry-info"></div>
        </div>
        <div class="user-status">
          <h3 id="otherLabel">Other</h3>
          <div id="otherStatus" class="status-circle"></div>
          <div id="otherTime" class="time-text">-</div>
          <div id="otherTimezone" class="timezone-info"></div>
          <div id="otherExpiry" class="expiry-info"></div>
        </div>
      </div>
      <button id="checkInBtn" onclick="checkIn()">I'm okay</button>
      <div id="lastUpdate">Connecting...</div>
    </div>
  </div>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  
  <script>
    const ACCESS_CODE = "together24";
    
    const firebaseConfig = {
      apiKey: "AIzaSyDNWN4YXuamyifYfr1PVbLv91YNcuSLT-c",
      authDomain: "check-in-d0f7c.firebaseapp.com",
      databaseURL: "https://check-in-d0f7c-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "check-in-d0f7c",
      storageBucket: "check-in-d0f7c.firebasestorage.app",
      messagingSenderId: "951259510445",
      appId: "1:951259510445:web:7d085e1d4d4ef22293f824",
      measurementId: "G-FW8NDC4SW4"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const CHECK_IN_DURATION = 24 * 60 * 60 * 1000;
    const WARNING_THRESHOLD = 4 * 60 * 60 * 1000;
    let currentUser = null;
    let myStatusRef = null;
    let otherStatusRef = null;
    let expiryCheckInterval = null;
    const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const userLocation = getUserLocationFromTimezone(userTimeZone);
    
    function getUserLocationFromTimezone(tz) {
      const timezoneMap = {
        'Africa/Maputo': 'Maputo, Mozambique',
        'Africa/Johannesburg': 'South Africa',
        'Europe/London': 'London, UK',
        'Europe/Lisbon': 'Portugal',
        'GMT': 'GMT'
      };
      return timezoneMap[tz] || tz;
    }
    
    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      const errorDiv = document.getElementById('passwordError');
      
      if (input === ACCESS_CODE) {
        document.getElementById('passwordScreen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'block';
        errorDiv.style.display = 'none';
      } else {
        errorDiv.style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    }
    
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
    
    function setUser(userType) {
      currentUser = userType;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      
      if (userType === 'you') {
        document.getElementById('myLabel').textContent = 'You';
        document.getElementById('otherLabel').textContent = 'Her';
        document.getElementById('myTimezone').textContent = `(${userLocation})`;
        myStatusRef = database.ref('status/you');
        otherStatusRef = database.ref('status/her');
      } else {
        document.getElementById('myLabel').textContent = 'You';
        document.getElementById('otherLabel').textContent = 'Him';
        document.getElementById('myTimezone').textContent = `(${userLocation})`;
        myStatusRef = database.ref('status/her');
        otherStatusRef = database.ref('status/you');
      }
      
      setupListeners();
      if (expiryCheckInterval) clearInterval(expiryCheckInterval);
      expiryCheckInterval = setInterval(checkExpiries, 60000);
    }
    
    function setupListeners() {
      myStatusRef.on('value', (snapshot) => {
        updateStatusDisplay(snapshot.val(), 'my');
        updateLastUpdateTime();
      });
      otherStatusRef.on('value', (snapshot) => {
        updateStatusDisplay(snapshot.val(), 'other');
        updateLastUpdateTime();
      });
    }
    
    function updateStatusDisplay(data, prefix) {
      const statusCircle = document.getElementById(`${prefix}Status`);
      const timeDiv = document.getElementById(`${prefix}Time`);
      const expiryDiv = document.getElementById(`${prefix}Expiry`);
      const timezoneDiv = document.getElementById(`${prefix}Timezone`);
      
      if (data && data.checkedIn && data.expiresAt && data.timestampUTC) {
        const nowUTC = Date.now();
        const checkInUTC = data.timestampUTC;
        const expiresAtUTC = data.expiresAt;
        const timeRemaining = expiresAtUTC - nowUTC;
        const localTime = new Date(checkInUTC);
        const timeString = localTime.toLocaleTimeString([], { 
          hour: '2-digit', 
          minute: '2-digit'
        });
        
        timeDiv.textContent = `${timeString}`;
        
        if (timeRemaining > 0) {
          statusCircle.classList.add('checked-in');
          statusCircle.classList.remove('expiring-soon');
          
          if (nowUTC - checkInUTC < 10000) {
            statusCircle.classList.add('pulse-animation');
            setTimeout(() => { statusCircle.classList.remove('pulse-animation'); }, 600);
          }
          
          if (timeRemaining < WARNING_THRESHOLD) {
            statusCircle.classList.add('expiring-soon');
            const hoursLeft = Math.ceil(timeRemaining / (60 * 60 * 1000));
            expiryDiv.textContent = `Expires in ~${hoursLeft}h`;
            expiryDiv.style.color = '#ff8c00';
          } else {
            const hoursLeft = Math.floor(timeRemaining / (60 * 60 * 1000));
            expiryDiv.textContent = `${hoursLeft}h left`;
            expiryDiv.style.color = '#666';
          }
        } else {
          statusCircle.classList.remove('checked-in', 'expiring-soon');
          timeDiv.textContent = `${timeString} (expired)`;
          expiryDiv.textContent = 'Expired';
          expiryDiv.style.color = '#999';
        }
      } else {
        statusCircle.classList.remove('checked-in', 'expiring-soon');
        timeDiv.textContent = '-';
        expiryDiv.textContent = '';
      }
      
      if (prefix === 'other' && data && data.timestampUTC) {
        const otherTime = new Date(data.timestampUTC);
        const userOffset = new Date().getTimezoneOffset();
        const otherOffset = otherTime.getTimezoneOffset();
        const timeDiff = Math.round((userOffset - otherOffset) / 60);
        
        if (timeDiff !== 0) {
          const diffText = timeDiff > 0 ? 
            `${Math.abs(timeDiff)}h ahead of you` : 
            `${Math.abs(timeDiff)}h behind you`;
          timezoneDiv.textContent = diffText;
        } else {
          timezoneDiv.textContent = 'Same timezone';
        }
      }
    }
    
    function checkIn() {
      if (!currentUser) return;
      const button = document.getElementById('checkInBtn');
      button.classList.add('clicked');
      setTimeout(() => { button.classList.remove('clicked'); }, 400);
      const nowUTC = Date.now();
      const expiresAtUTC = nowUTC + CHECK_IN_DURATION;
      myStatusRef.set({
        checkedIn: true,
        timestampUTC: nowUTC,
        expiresAt: expiresAtUTC
      });
    }
    
    function checkExpiries() {
      if (myStatusRef) {
        myStatusRef.once('value', (snapshot) => {
          updateStatusDisplay(snapshot.val(), 'my');
        });
      }
      if (otherStatusRef) {
        otherStatusRef.once('value', (snapshot) => {
          updateStatusDisplay(snapshot.val(), 'other');
        });
      }
      updateLastUpdateTime();
    }
    
    function updateLastUpdateTime() {
      const now = new Date();
      const localTime = now.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit'
      });
      document.getElementById('lastUpdate').textContent = `Updated: ${localTime}`;
    }
  </script>
</body>
</html>
