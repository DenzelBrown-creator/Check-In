<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Check-In</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #f7f8f6, #eef1ee);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 48px 42px;
      border-radius: 22px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 8px 16px rgba(0,0,0,0.04);
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #2f3a34;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .user-select {
      margin-bottom: 30px;
    }
    .user-select button {
      margin: 5px;
      padding: 10px 20px;
      background: #e6ebe8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .user-select button:hover {
      background: #d0d8d2;
    }
    .user-select button.selected {
      background: #2f8f6b;
      color: white;
    }
    p {
      font-size: 15px;
      color: #6b756f;
      line-height: 1.5;
      margin-bottom: 36px;
    }
    .status-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .user-status {
      text-align: center;
    }
    .user-status h3 {
      font-size: 16px;
      font-weight: 500;
      color: #555;
      margin-bottom: 15px;
    }
    .status-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: #e6ebe8;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .status-circle.checked-in {
      background: #7ec9a2;
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(126, 201, 162, 0.3);
    }
    .status-circle.expiring-soon {
      background: #ffb347; /* Laranja para indicar que vai expirar */
      animation: gentle-pulse 2s infinite;
    }
    .status-circle.checked-in::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 38px;
      color: white;
      font-weight: 500;
    }
    @keyframes gentle-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    .pulse-animation {
      animation: pulse 0.6s ease;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1.05); }
    }
    button#checkInBtn {
      background: #2f8f6b;
      border: none;
      border-radius: 14px;
      padding: 16px 40px;
      font-size: 17px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 18px rgba(47,143,107,0.25);
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }
    button#checkInBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(47,143,107,0.3);
    }
    button#checkInBtn:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(47,143,107,0.25);
    }
    button#checkInBtn.clicked {
      animation: buttonClick 0.4s ease;
    }
    @keyframes buttonClick {
      0% { transform: scale(1); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    #lastUpdate {
      font-size: 13px;
      color: #888;
      margin-top: 25px;
      font-style: italic;
    }
    .time-text {
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }
    .expiry-info {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Daily Check-In</h1>
    
    <div id="loginScreen">
      <p>Who are you?</p>
      <div class="user-select">
        <button onclick="setUser('you')">Him/Denzel</button>
        <button onclick="setUser('her')">You/Her</button>
      </div>
    </div>

    <div id="appScreen" style="display: none;">
      <p>A quiet signal to let the other person know you're okay today.</p>

      <div class="status-container">
        <div class="user-status">
          <h3 id="myLabel">You</h3>
          <div id="myStatus" class="status-circle"></div>
          <div id="myTime" class="time-text">-</div>
          <div id="myExpiry" class="expiry-info"></div>
        </div>
        <div class="user-status">
          <h3 id="otherLabel">Other</h3>
          <div id="otherStatus" class="status-circle"></div>
          <div id="otherTime" class="time-text">-</div>
          <div id="otherExpiry" class="expiry-info"></div>
        </div>
      </div>

      <button id="checkInBtn" onclick="checkIn()">I'm okay</button>
      <div id="lastUpdate">Connecting...</div>
    </div>
  </div>

  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDNWN4YXuamyifYfr1PVbLv91YNcuSLT-c",
      authDomain: "check-in-d0f7c.firebaseapp.com",
      databaseURL: "https://check-in-d0f7c-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "check-in-d0f7c",
      storageBucket: "check-in-d0f7c.firebasestorage.app",
      messagingSenderId: "951259510445",
      appId: "1:951259510445:web:7d085e1d4d4ef22293f824",
      measurementId: "G-FW8NDC4SW4"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // CHECK-IN DURATION: 12 hours in milliseconds
    const CHECK_IN_DURATION = 12 * 60 * 60 * 1000;
    // WARNING THRESHOLD: 1 hour before expiry (changes color to orange)
    const WARNING_THRESHOLD = 60 * 60 * 1000;
    
    let currentUser = null;
    let myStatusRef = null;
    let otherStatusRef = null;
    let expiryCheckInterval = null;

    function setUser(userType) {
      currentUser = userType;
      
      // Esconde a tela de login, mostra o app
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      
      // Configura labels baseado em quem está logado
      if (userType === 'you') {
        // Denzel está vendo
        document.getElementById('myLabel').textContent = 'You';
        document.getElementById('otherLabel').textContent = 'Her';
        
        myStatusRef = database.ref('status/you');    // Denzel
        otherStatusRef = database.ref('status/her'); // Ela
      } else {
        // Ela está vendo
        document.getElementById('myLabel').textContent = 'You';
        document.getElementById('otherLabel').textContent = 'Him';
        
        myStatusRef = database.ref('status/her');    // Ela
        otherStatusRef = database.ref('status/you'); // Denzel
      }
      
      // Inicia os listeners
      setupListeners();
      
      // Inicia o verificador de expiração
      if (expiryCheckInterval) clearInterval(expiryCheckInterval);
      expiryCheckInterval = setInterval(checkExpiries, 60000); // Verifica a cada minuto
    }

    function setupListeners() {
      // Listen for changes to YOUR status
      myStatusRef.on('value', (snapshot) => {
        updateStatusDisplay(snapshot.val(), 'my');
        updateLastUpdateTime();
      });

      // Listen for changes to OTHER person's status
      otherStatusRef.on('value', (snapshot) => {
        updateStatusDisplay(snapshot.val(), 'other');
        updateLastUpdateTime();
      });
    }

    function updateStatusDisplay(data, prefix) {
      const statusCircle = document.getElementById(`${prefix}Status`);
      const timeDiv = document.getElementById(`${prefix}Time`);
      const expiryDiv = document.getElementById(`${prefix}Expiry`);
      
      if (data && data.checkedIn && data.expiresAt) {
        const now = Date.now();
        const expiresAt = data.expiresAt;
        const timeRemaining = expiresAt - now;
        
        // Update time display
        timeDiv.textContent = `at ${data.lastCheckIn}`;
        
        // Update circle color based on expiry
        if (timeRemaining > 0) {
          statusCircle.classList.add('checked-in');
          statusCircle.classList.remove('expiring-soon');
          
          // Add pulse animation for new check-ins (first 10 seconds)
          if (now - data.timestamp < 10000) {
            statusCircle.classList.add('pulse-animation');
            setTimeout(() => {
              statusCircle.classList.remove('pulse-animation');
            }, 600);
          }
          
          // Show warning if expiring soon (last hour)
          if (timeRemaining < WARNING_THRESHOLD) {
            statusCircle.classList.add('expiring-soon');
            const hoursLeft = Math.ceil(timeRemaining / (60 * 60 * 1000));
            expiryDiv.textContent = `Expires in ~${hoursLeft}h`;
            expiryDiv.style.color = '#ff8c00';
          } else {
            const hoursLeft = Math.floor(timeRemaining / (60 * 60 * 1000));
            expiryDiv.textContent = `Valid for ${hoursLeft}h`;
            expiryDiv.style.color = '#666';
          }
        } else {
          // Expired
          statusCircle.classList.remove('checked-in', 'expiring-soon');
          timeDiv.textContent = `at ${data.lastCheckIn} (expired)`;
          expiryDiv.textContent = 'Expired';
          expiryDiv.style.color = '#999';
        }
      } else {
        // No active check-in
        statusCircle.classList.remove('checked-in', 'expiring-soon');
        timeDiv.textContent = '-';
        expiryDiv.textContent = '';
      }
    }

    function checkIn() {
      if (!currentUser) return;
      
      // Button click animation
      const button = document.getElementById('checkInBtn');
      button.classList.add('clicked');
      setTimeout(() => {
        button.classList.remove('clicked');
      }, 400);
      
      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const expiresAt = Date.now() + CHECK_IN_DURATION;
      
      // Update YOUR status in the database
      myStatusRef.set({
        checkedIn: true,
        lastCheckIn: timeString,
        expiresAt: expiresAt,
        timestamp: Date.now()
      });
    }

    function checkExpiries() {
      // This function runs every minute to check for expired check-ins
      // It ensures the UI updates even if no Firebase events fire
      if (myStatusRef) {
        myStatusRef.once('value', (snapshot) => {
          updateStatusDisplay(snapshot.val(), 'my');
        });
      }
      if (otherStatusRef) {
        otherStatusRef.once('value', (snapshot) => {
          updateStatusDisplay(snapshot.val(), 'other');
        });
      }
      updateLastUpdateTime();
    }

    function updateLastUpdateTime() {
      const now = new Date();
      document.getElementById('lastUpdate').textContent = `Updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }
  </script>
</body>
</html>
