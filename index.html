<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Check-In</title>
  <style>
    /* TODO O CSS ANTERIOR (mantenha igual) */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #f7f8f6, #eef1ee);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 48px 42px;
      border-radius: 22px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 8px 16px rgba(0,0,0,0.04);
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #2f3a34;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .user-select {
      margin-bottom: 30px;
    }
    .user-select button {
      margin: 5px;
      padding: 10px 20px;
      background: #e6ebe8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .user-select button.selected {
      background: #2f8f6b;
      color: white;
    }
    /* ... resto do CSS igual ... */
  </style>
</head>
<body>

  <div class="card">
    <h1>Daily Check-In</h1>
    
    <div id="loginScreen">
      <p>Who are you?</p>
      <div class="user-select">
        <button onclick="setUser('user1')">You</button>
        <button onclick="setUser('user2')">Her</button>
      </div>
    </div>

    <div id="appScreen" style="display: none;">
      <p>A quiet signal to let the other person know you're okay today.</p>

      <div class="status-container">
        <div class="user-status">
          <h3>You</h3>
          <div id="myStatus" class="status-circle"></div>
          <div id="myTime">-</div>
        </div>
        <div class="user-status">
          <h3>Her</h3>
          <div id="herStatus" class="status-circle"></div>
          <div id="herTime">-</div>
        </div>
      </div>

      <button id="checkInBtn" onclick="checkIn()">I'm okay</button>
      <div id="lastUpdate">Connecting...</div>
    </div>
  </div>

  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDNWN4YXuamyifYfr1PVbLv91YNcuSLT-c",
      authDomain: "check-in-d0f7c.firebaseapp.com",
      databaseURL: "https://check-in-d0f7c-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "check-in-d0f7c",
      storageBucket: "check-in-d0f7c.firebasestorage.app",
      messagingSenderId: "951259510445",
      appId: "1:951259510445:web:7d085e1d4d4ef22293f824",
      measurementId: "G-FW8NDC4SW4"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let currentUser = null;
    let myStatusRef = null;
    let herStatusRef = null;

    function setUser(userId) {
      currentUser = userId;
      
      // Esconde a tela de login, mostra o app
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      
      // Configura as referências baseadas no usuário
      if (userId === 'user1') {
        myStatusRef = database.ref('status/user1');
        herStatusRef = database.ref('status/user2');
      } else {
        myStatusRef = database.ref('status/user2');
        herStatusRef = database.ref('status/user1');
      }
      
      // Inicia os listeners
      setupListeners();
    }

    function setupListeners() {
      // Listen for changes to YOUR status
      myStatusRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const myStatusCircle = document.getElementById('myStatus');
        const myTimeDiv = document.getElementById('myTime');

        if (data && data.checkedIn) {
          myStatusCircle.classList.add('checked-in');
          myTimeDiv.textContent = `at ${data.lastCheckIn}`;
        } else {
          myStatusCircle.classList.remove('checked-in');
          myTimeDiv.textContent = '-';
        }
        updateLastUpdateTime();
      });

      // Listen for changes to HER status
      herStatusRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const herStatusCircle = document.getElementById('herStatus');
        const herTimeDiv = document.getElementById('herTime');

        if (data && data.checkedIn) {
          herStatusCircle.classList.add('checked-in');
          herTimeDiv.textContent = `at ${data.lastCheckIn}`;
        } else {
          herStatusCircle.classList.remove('checked-in');
          herTimeDiv.textContent = '-';
        }
        updateLastUpdateTime();
      });
    }

    function checkIn() {
      if (!currentUser) return;
      
      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      // Update YOUR status in the database
      myStatusRef.set({
        checkedIn: true,
        lastCheckIn: timeString
      });
    }

    function updateLastUpdateTime() {
      const now = new Date();
      document.getElementById('lastUpdate').textContent = `Updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }
  </script>
</body>
</html>
