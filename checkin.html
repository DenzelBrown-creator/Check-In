<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check-In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #f7f8f6, #eef1ee);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #ffffff;
      padding: 48px 42px;
      border-radius: 22px;
      width: 340px;
      text-align: center;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.06),
        0 8px 16px rgba(0,0,0,0.04);
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #2f3a34;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      color: #6b756f;
      line-height: 1.5;
      margin-bottom: 36px;
    }

    .status {
      width: 110px;
      height: 110px;
      margin: 0 auto 36px;
      border-radius: 50%;
      background: #e6ebe8;
      position: relative;
      transition: background 0.4s ease;
    }

    .status.ok {
      background: #7ec9a2;
    }

    .status.ok::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 38px;
      color: white;
      font-weight: 500;
    }

    button {
      background: #2f8f6b;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 18px rgba(47,143,107,0.25);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(47,143,107,0.28);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(47,143,107,0.22);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Check-In</h1>
    <p>A quiet signal to let the other person know you’re okay today.</p>

    <div id="status" class="status"></div>

    <button onclick="checkIn()">I’m okay</button>
  </div>

  <script>
    function checkIn() {
      document.getElementById("status").classList.add("ok");
    }
  </script>

</body>
</html>
